name: Build YAHA Travels Signed Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "native-android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YAHA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      YAHA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      YAHA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 secret"; exit 1)
          test -n "$YAHA_KEYSTORE_PASSWORD" || (echo "Missing KEYSTORE_PASSWORD secret"; exit 1)
          test -n "$YAHA_KEY_ALIAS" || (echo "Missing KEY_ALIAS secret"; exit 1)
          test -n "$YAHA_KEY_PASSWORD" || (echo "Missing KEY_PASSWORD secret"; exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yaha-release.jks"
          test -s "$RUNNER_TEMP/yaha-release.jks"
          echo "YAHA_KEYSTORE_FILE=$RUNNER_TEMP/yaha-release.jks" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed release APK
        working-directory: native-android
        run: gradle assembleRelease

      - name: Verify release APK
        run: |
          APK="native-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: YAHA-TRAVELS-SIGNED-RELEASE-APK
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
