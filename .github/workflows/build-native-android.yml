name: Build YAHA Native Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "native-android/**"
      - ".github/workflows/build-native-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaha-travels-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
