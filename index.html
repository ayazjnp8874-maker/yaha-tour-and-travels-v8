
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAHA TOUR AND TRAVELS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial,sans-serif}
header{background:#ffd400;color:#111;padding:24px 12px;text-align:center}
header h1{font-size:24px;margin:0}
header p{margin:8px 0 0}
main{max-width:520px;margin:20px auto;padding:14px}
.card{background:#222;padding:20px;border-radius:14px;margin-bottom:16px}
h2{color:#ffd400;margin-top:0}
label{display:block;margin:13px 0 6px}
input,select{width:100%;padding:13px;border:1px solid #555;border-radius:7px;background:#333;color:white;font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:8px;background:#ffd400;color:#111;font-size:17px;font-weight:bold;margin-top:18px}
.price{color:#ffd400;font-weight:bold}
.note{color:#bbb;font-size:13px;line-height:1.6}
footer{text-align:center;color:#aaa;padding:20px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>YAHA TOUR AND TRAVELS</h1>
<p>आपका सफर, हमारी जिम्मेदारी</p>
<p>Jaunpur, Uttar Pradesh</p>
</header>

<main>
<div class="card">
<h2>हमारी सेवाएँ</h2>
<p>🚘 Ertiga – <span class="price">₹14 / KM</span></p>
<p>🚘 Dzire – <span class="price">₹12 / KM</span></p>
<p>🏍️ Bike Booking – किराया पूछें</p>
</div>

<div class="card">
<h2>Online Booking</h2>
<form id="bookingForm">
<label>आपका नाम</label>
<input id="name" required placeholder="अपना नाम लिखें">

<label>मोबाइल नंबर</label>
<input id="phone" required type="tel" placeholder="मोबाइल नंबर">

<label>वाहन चुनें</label>
<select id="vehicle" required>
<option value="">वाहन चुनें</option>
<option>Ertiga</option>
<option>Dzire</option>
<option>Bike</option>
</select>

<label>कहाँ से जाना है?</label>
<input id="pickup" required placeholder="Pickup Location">

<label>कहाँ जाना है?</label>
<input id="drop" required placeholder="Drop Location">

<label>यात्रा की तारीख</label>
<input id="date" required type="date">

<label>यात्रियों की संख्या</label>
<input id="people" type="number" min="1" value="1" required>

<label>अन्य जानकारी</label>
<input id="details" placeholder="अतिरिक्त जानकारी (वैकल्पिक)">

<button type="submit">WhatsApp पर Booking भेजें</button>
</form>
<p class="note">बुकिंग की पुष्टि हमारी टीम WhatsApp पर करेगी।</p>
</div>

<div class="card">
<h2>Contact Us</h2>
<p>📞 +91 88745 47741</p>
<button onclick="window.open('https://wa.me/918874547741','_blank')">WhatsApp पर संपर्क करें</button>
</div>
</main>

<footer>© YAHA TOUR AND TRAVELS</footer>

<script>
document.getElementById("bookingForm").addEventListener("submit",function(e){
e.preventDefault();
const msg =
"NEW BOOKING - YAHA TOUR AND TRAVELS\n\n"+
"Name: "+document.getElementById("name").value+"\n"+
"Phone: "+document.getElementById("phone").value+"\n"+
"Vehicle: "+document.getElementById("vehicle").value+"\n"+
"Pickup: "+document.getElementById("pickup").value+"\n"+
"Drop: "+document.getElementById("drop").value+"\n"+
"Date: "+document.getElementById("date").value+"\n"+
"Passengers: "+document.getElementById("people").value+"\n"+
"Details: "+document.getElementById("details").value;
window.open("https://wa.me/918874547741?text="+encodeURIComponent(msg),"_blank");
});
</script>
</body>
</html>
